<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><title>登录 · 好好吃饭</title><link rel="icon" href="/favicon.svg" /><link rel="stylesheet" href="/nutrition.css" /><script type="module" src="/login.js"></script></head>
<body class="login-page"><main class="login-card"><div class="login-brand"><img src="/favicon.svg" width="44" height="44" alt="" /><span>好好吃饭</span></div><h1>好好吃饭，<br />也好好照顾自己。</h1><form id="login-form" class="account-form"><label>账号<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required placeholder="输入你的登录账号" /></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="输入密码" /></label><button class="button primary" type="submit">打开我的饮食手记 ↗</button><p id="login-error" role="alert"></p></form><p class="subtle">忘记密码时，请联系家里的管理员重置。</p></main></body></html>
